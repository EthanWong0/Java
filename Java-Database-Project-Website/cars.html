<!DOCTYPE html>
<html>
  <head>
    <title> Database Project: Cars </title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="components.css" rel="stylesheet" type ="text/css"
    <!-- import JS file -->
    <script src="cars.js"></script>
    <script src="components.js"></script>

  </head>
  
  <!-- Call the int function when website loads -->
  <body onload="init()">
      <!--  Header or Banner -->
      <div id="header">
        <h1> Database Project - Cars</h1>
      </div>

      <!--  nav bar -->
      <nav id='nav'>
        <h2> Navigation - Cars </h2>
            <a href="index.html" class="button">HOME</a>   
            <a href="cars.html" class="button">CARS</a> 
            <a href="customers.html" class="button">CUSTOMERS</a>
      </nav>
      
      <!--  Main content (has 3 panels) -->
      <div class="container">
        
        <div class='panel'>
          <div class="container filter">
            <div>          
              Left Panel
              <h4> Search by model </h4>
              <input style="flex:2;text-align:right;" type="text" 
                id="carModel" placeholder="Enter car model" >        
              <a class="button" onclick="filterByModel()"> Search </a><br>
            </div>
          </div>
          <div class="container filter">
            <div>          
              <h4> Search by dealership </h4>
              <input style="flex:2;text-align:right;" type="text" 
                id="dealershipName" placeholder="Enter dealership" >        
              <a class="button" onclick="filterByDealership()"> Search </a><br>
            </div>
          </div>
          <div class = "container">
           <h2 id = count> Cards found: </h2>
          </div>
        </div>
        
        <div id='centerpanel' class='container'>
          Center Panel
        </div>
   
        
      </div>
      
      <!--  Footer -->
      <div id='foot'>
        <h3> This Website is owned by the owners of the website </h3>
      </div>

    
    
  </body>
</html>
